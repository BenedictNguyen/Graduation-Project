<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Keo dán/Glue stick -->
  <rect x="24" y="12" width="16" height="32" rx="8" fill="#9B59B6" stroke="#8E44AD" stroke-width="2"/>
  <!-- Glue cap -->
  <rect x="26" y="8" width="12" height="8" rx="6" fill="#E74C3C" stroke="#C0392B" stroke-width="2"/>
  <!-- Glue body texture -->
  <rect x="26" y="16" width="12" height="24" rx="6" fill="#BF7FBF"/>
  <!-- Label on body -->
  <rect x="28" y="20" width="8" height="6" rx="1" fill="#FFFFFF" opacity="0.8"/>
  <rect x="28" y="28" width="8" height="2" rx="1" fill="#FFFFFF" opacity="0.6"/>
  <rect x="28" y="32" width="8" height="2" rx="1" fill="#FFFFFF" opacity="0.6"/>
  <!-- Glue application area -->
  <ellipse cx="32" cy="46" rx="6" ry="2" fill="#E8E8E8" opacity="0.7"/>
  <!-- Label -->
  <text x="32" y="56" text-anchor="middle" font-family="Arial" font-size="8" fill="#333">Keo dán</text>
</svg>
