<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Trà dâu/Strawberry tea cup -->
  <ellipse cx="32" cy="44" rx="18" ry="4" fill="#8B4513" opacity="0.3"/>
  <!-- Cup body -->
  <path d="M16 24 C16 20, 20 16, 24 16 L40 16 C44 16, 48 20, 48 24 L46 40 C46 44, 42 48, 38 48 L26 48 C22 48, 18 44, 18 40 Z" fill="#FFFFFF" stroke="#D5D5D5" stroke-width="2"/>
  <!-- Tea liquid (strawberry pink) -->
  <path d="M18 26 L46 26 L44 38 C44 40, 42 42, 40 42 L24 42 C22 42, 20 40, 20 38 Z" fill="#FF69B4"/>
  <!-- Cup handle -->
  <path d="M48 28 C52 28, 54 32, 52 36 C50 38, 48 36, 48 34" fill="none" stroke="#D5D5D5" stroke-width="3" stroke-linecap="round"/>
  <!-- Strawberry pieces floating -->
  <path d="M28 32 C26 30, 30 30, 30 32 C30 34, 26 34, 28 32" fill="#DC143C"/>
  <path d="M36 30 C34 28, 38 28, 38 30 C38 32, 34 32, 36 30" fill="#DC143C"/>
  <path d="M32 36 C30 34, 34 34, 34 36 C34 38, 30 38, 32 36" fill="#DC143C"/>
  <!-- Strawberry seeds -->
  <circle cx="28" cy="32" r="0.5" fill="#FFFF00"/>
  <circle cx="36" cy="30" r="0.5" fill="#FFFF00"/>
  <circle cx="32" cy="36" r="0.5" fill="#FFFF00"/>
  <!-- Steam -->
  <path d="M28 12 C28 8, 30 10, 30 6" stroke="#E8E8E8" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M32 14 C32 10, 34 12, 34 8" stroke="#E8E8E8" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M36 12 C36 8, 38 10, 38 6" stroke="#E8E8E8" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- Label -->
  <text x="32" y="56" text-anchor="middle" font-family="Arial" font-size="8" fill="#333">Trà dâu</text>
</svg>
