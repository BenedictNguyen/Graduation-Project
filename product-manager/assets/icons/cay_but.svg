<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Cây bút/Pen -->
  <line x1="32" y1="8" x2="32" y2="48" stroke="#2C3E50" stroke-width="4" stroke-linecap="round"/>
  <!-- Pen tip -->
  <polygon points="32,8 28,16 36,16" fill="#34495E"/>
  <!-- Pen body -->
  <rect x="28" y="16" width="8" height="24" fill="#3498DB" stroke="#2980B9" stroke-width="1"/>
  <!-- Pen grip -->
  <rect x="28" y="32" width="8" height="8" fill="#E74C3C" stroke="#C0392B" stroke-width="1"/>
  <!-- Pen cap -->
  <rect x="28" y="40" width="8" height="8" fill="#F39C12" stroke="#E67E22" stroke-width="1"/>
  <!-- Decorative lines -->
  <line x1="30" y1="20" x2="34" y2="20" stroke="#2980B9" stroke-width="1"/>
  <line x1="30" y1="24" x2="34" y2="24" stroke="#2980B9" stroke-width="1"/>
  <line x1="30" y1="28" x2="34" y2="28" stroke="#2980B9" stroke-width="1"/>
  <!-- Label -->
  <text x="32" y="56" text-anchor="middle" font-family="Arial" font-size="8" fill="#333">Cây bút</text>
</svg>
