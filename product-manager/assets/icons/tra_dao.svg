  <path d="M26 32 L30 32" stroke="#FF4500" stroke-width="1"/>
  <path d="M34 30 L38 30" stroke="#FF4500" stroke-width="1"/>
  <!-- Steam -->
  <path d="M28 12 C28 8, 30 10, 30 6" stroke="#E8E8E8" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M32 14 C32 10, 34 12, 34 8" stroke="#E8E8E8" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M36 12 C36 8, 38 10, 38 6" stroke="#E8E8E8" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- Label -->
  <text x="32" y="56" text-anchor="middle" font-family="Arial" font-size="8" fill="#333">Trà đào</text>
</svg>
