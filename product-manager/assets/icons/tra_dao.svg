  <path d="M16 24 C16 20, 20 16, 24 16 L40 16 C44 16, 48 20, 48 24 L46 40 C46 44, 42 48, 38 48 L26 48 C22 48, 18 44, 18 40 Z" fill="#FFFFFF" stroke="#D5D5D5" stroke-width="2"/>
  <!-- Tea liquid (peachy color) -->
  <path d="M18 26 L46 26 L44 38 C44 40, 42 42, 40 42 L24 42 C22 42, 20 40, 20 38 Z" fill="#FFB07A"/>
  <!-- Cup handle -->
  <path d="M48 28 C52 28, 54 32, 52 36 C50 38, 48 36, 48 34" fill="none" stroke="#D5D5D5" stroke-width="3" stroke-linecap="round"/>
  <!-- Peach slices floating -->
  <ellipse cx="28" cy="32" rx="3" ry="2" fill="#FF6347" opacity="0.8"/>
  <ellipse cx="36" cy="30" rx="2.5" ry="1.5" fill="#FF7F50" opacity="0.8"/>
  <ellipse cx="32" cy="36" rx="2.8" ry="1.8" fill="#FF6347" opacity="0.7"/>
